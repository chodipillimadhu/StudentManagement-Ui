<div class="container mt-5">

  <div class="card p-4">

    <h3>Login</h3>

    <input
      type="text"
      class="form-control mb-3"
      placeholder="Username"
      [(ngModel)]="username">

    <input
      type="password"
      class="form-control mb-3"
      placeholder="Password"
      [(ngModel)]="password">

    <button
      class="btn btn-primary"
      (click)="login()">

      Login
    </button>

  </div>

</div>
